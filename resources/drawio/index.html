<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>PM Runtime offline drawio M0 fixture</title>
<style>body{margin:0;font:14px system-ui;background:#f6f8fb;color:#172033}#toolbar{height:40px;padding:8px 12px;box-sizing:border-box;background:#172033;color:white}button{margin-right:8px}svg{display:block;width:100%;height:calc(100vh - 40px);background:white}.node{cursor:move}.label{user-select:none;font-size:16px;fill:#172033}</style></head>
<body><div id="toolbar"><button id="save">保存 XML</button><button id="export">导出 SVG</button><button id="exportPng">导出 PNG</button><span id="hint">离线 fixture</span></div><svg id="canvas" viewBox="0 0 760 360" aria-label="可编辑流程图"></svg>
<script>
const svg=document.querySelector('#canvas'), hint=document.querySelector('#hint'); let model={title:'中文门禁流程',nodes:[],edges:[]};
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function render(){svg.innerHTML=''; for(const [a,b] of model.edges){const n1=model.nodes.find(n=>n.id===a),n2=model.nodes.find(n=>n.id===b); if(!n1||!n2)continue; const l=document.createElementNS('http://www.w3.org/2000/svg','line'); Object.assign(l,{x1:n1.x+90,y1:n1.y+24,x2:n2.x,y2:n2.y+24}); l.setAttribute('stroke','#58708e');l.setAttribute('stroke-width','2');svg.append(l)} for(const n of model.nodes){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('node');g.setAttribute('transform',`translate(${n.x},${n.y})`);g.dataset.id=n.id; const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('width','150');r.setAttribute('height','48');r.setAttribute('rx','8');r.setAttribute('fill','#e8f0ff');r.setAttribute('stroke','#4267a8');const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x','12');t.setAttribute('y','30');t.classList.add('label');t.textContent=n.label;g.append(r,t);g.addEventListener('dblclick',()=>{const next=prompt('节点文字',n.label);if(next){n.label=next;render()}});g.addEventListener('pointerdown',e=>{const sx=e.clientX,sy=e.clientY,ox=n.x,oy=n.y;const move=q=>{n.x=ox+q.clientX-sx;n.y=oy+q.clientY-sy;render()};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)});svg.append(g)}}
function toXml(){return `<mxfile><diagram name="${esc(model.title)}"><mxGraphModel>${model.nodes.map(n=>`<mxCell id="${esc(n.id)}" value="${esc(n.label)}" vertex="1" x="${n.x}" y="${n.y}"/>`).join('')}${model.edges.map((e,i)=>`<mxCell id="edge-${i}" source="${esc(e[0])}" target="${esc(e[1])}" edge="1"/>`).join('')}</mxGraphModel></diagram></mxfile>`}
window.addEventListener('message',e=>{if(e.data?.type==='drawio.load'){model=e.data.data;render()}if(e.data?.type==='drawio.loadXml'){const doc=new DOMParser().parseFromString(e.data.xml,'application/xml');model={title:doc.querySelector('diagram')?.getAttribute('name')||'重开图形',nodes:[...doc.querySelectorAll('mxCell[vertex="1"]')].map(n=>({id:n.getAttribute('id'),label:n.getAttribute('value')||'',x:Number(n.getAttribute('x')||0),y:Number(n.getAttribute('y')||0)})),edges:[...doc.querySelectorAll('mxCell[edge="1"]')].map(e=>[e.getAttribute('source'),e.getAttribute('target')])};render()}});
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
document.querySelector('#save').onclick=()=>{hint.textContent='已保存 XML';parent.postMessage({type:'drawio.saved',xml:toXml()},'*')};document.querySelector('#export').onclick=()=>{download(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),'pm-runtime-fixture.svg');hint.textContent='已导出 SVG'};document.querySelector('#exportPng').onclick=()=>{const canvas=document.createElement('canvas');canvas.width=760;canvas.height=360;const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,760,360);ctx.strokeStyle='#58708e';ctx.lineWidth=2;for(const [a,b] of model.edges){const n1=model.nodes.find(n=>n.id===a),n2=model.nodes.find(n=>n.id===b);if(n1&&n2){ctx.beginPath();ctx.moveTo(n1.x+90,n1.y+24);ctx.lineTo(n2.x,n2.y+24);ctx.stroke()}}for(const n of model.nodes){ctx.fillStyle='#e8f0ff';ctx.strokeStyle='#4267a8';ctx.roundRect(n.x,n.y,150,48,8);ctx.fill();ctx.stroke();ctx.fillStyle='#172033';ctx.font='16px system-ui';ctx.fillText(n.label,n.x+12,n.y+30)}canvas.toBlob(blob=>{if(blob)download(blob,'pm-runtime-fixture.png')},'image/png');hint.textContent='已导出 PNG'};
parent.postMessage({type:'drawio.ready'},'*');
</script></body></html>
